<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العزيز | تجميل ومستلزمات طبية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf1f3;--card:#fff;--ink:#3a1827;--mut:#8b6574;--gold:#b98a3e;--gold2:#e4c27a;--rose:#d9798f;--plum:#7a2e55;--night:#16080f;--line:#f0d6dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0d16;--card:#2a1421;--ink:#fbe9ee;--mut:#c9a2b1;--line:#46233a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d0d16;--card:#2a1421;--ink:#fbe9ee;--mut:#c9a2b1;--line:#46233a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:.65rem 1.1rem;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2b1608}
.rose{background:var(--rose);color:#fff}.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
input,select{width:100%;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
label{display:block;font-size:.85rem;color:var(--mut);margin:.7rem 0 .25rem}
/* intro */
#intro{position:fixed;inset:0;background:var(--night);z-index:99;display:grid;place-items:center;transition:opacity .9s .1s,visibility 0s 1s}
#intro.off{opacity:0;visibility:hidden}
.ig{position:relative;width:min(70vmin,360px);aspect-ratio:1}
.ig svg{position:absolute;inset:-8%;width:116%;height:116%;transform:rotate(-90deg)}
.ig circle{fill:none;stroke:var(--gold2);stroke-width:1.5;stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.8s ease forwards}
.ig img{width:100%;border-radius:50%;opacity:0;transform:scale(.86);animation:pop 1.4s .5s ease forwards;filter:drop-shadow(0 0 30px #c9a15a66)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1;transform:none}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold2);opacity:0;animation:fl 3s ease-in infinite}
@keyframes fl{0%{opacity:0;transform:translateY(40px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-140px)}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
/* layout */
header{position:sticky;top:0;z-index:20;background:var(--night);color:#fff;display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;border-bottom:2px solid var(--gold)}
header img{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold2)}
header b{font-family:'Reem Kufi',Cairo;font-size:1.5rem;color:var(--gold2);margin-inline-end:auto}
nav{display:flex;gap:.4rem;flex-wrap:wrap}nav button{background:#ffffff14;color:#fff;padding:.45rem .8rem}nav button.on{background:var(--gold2);color:#2b1608}
main{max-width:1200px;margin:auto;padding:1.2rem}
.view{display:none}.view.on{display:block;animation:in .5s}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.2rem}
#login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle at 20% 10%,#f5c9d4 0,transparent 45%),radial-gradient(circle at 85% 90%,#e4c27a55 0,transparent 40%),var(--bg)}
#login .card{width:min(420px,100%);text-align:center;box-shadow:0 20px 60px #7a2e5522}
#login img{width:120px;border-radius:50%;border:2px solid var(--gold)}
h1,h2{font-family:'Reem Kufi',Cairo}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:1rem 0 .3rem}.tabs button{flex:1;background:transparent;color:var(--mut)}.tabs button.on{background:var(--card);color:var(--plum);box-shadow:0 2px 8px #0001}
.err{color:#c0334f;min-height:1.4rem;font-size:.9rem}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.bar input{flex:1;min-width:200px}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.p{display:flex;flex-direction:column;gap:.3rem;position:relative;overflow:hidden}
.p .ic{font-size:3rem;text-align:center;background:linear-gradient(160deg,#fde6ec,#f6e3bd);border-radius:14px;padding:.8rem}
.p small{color:var(--mut)}.price{font-weight:800;color:var(--plum)}.old{text-decoration:line-through;color:var(--mut);font-size:.85rem}
.tag{position:absolute;top:.7rem;inset-inline-start:.7rem;background:var(--rose);color:#fff;border-radius:99px;padding:.1rem .6rem;font-size:.8rem}
.low{color:#c0334f;font-size:.8rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:.55rem;text-align:start;border-bottom:1px solid var(--line)}.sc{overflow-x:auto}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px dashed var(--line);align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.pay{display:grid;gap:.5rem}.pay label{display:flex;gap:.6rem;align-items:center;margin:0;padding:.7rem;border:1.5px solid var(--line);border-radius:12px;color:var(--ink);cursor:pointer}.pay input{width:auto}
.steps{display:flex;justify-content:space-between;margin:1.5rem 0;position:relative;text-align:center}
.steps:before{content:"";position:absolute;top:19px;inset-inline:8%;height:4px;background:var(--line)}
.st{position:relative;flex:1;font-size:.85rem;color:var(--mut)}.st i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--card);border:3px solid var(--line);margin:0 auto .4rem;font-style:normal}
.st.d{color:var(--ink)}.st.d i{background:var(--rose);border-color:var(--rose);color:#fff}.st.c i{border-color:var(--gold);background:var(--gold2);color:#2b1608}
footer{margin-top:2rem;padding:1.2rem;text-align:center;background:var(--night);color:var(--gold2);border-radius:18px}footer a{color:#fff;font-size:1.3rem;font-weight:800;text-decoration:none;direction:ltr;unicode-bidi:embed}
#toast{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,120px);background:var(--night);color:var(--gold2);padding:.7rem 1.2rem;border-radius:99px;transition:.3s;z-index:60}#toast.on{transform:translate(-50%,0)}
.hide{display:none!important}
</style>
</head>

let st={products:seed.map((s,i)=>({id:i+1,name:s[0],bc:s[1],cat:s[2],price:s[3],disc:s[4],qty:s[5]})),orders:[],nid:1001};
try{const x=localStorage.getItem("alaziz");if(x)st=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem("alaziz",JSON.stringify(st))}catch(e){}};
let user=null,cart={},edit=null,role="c";
const fin=p=>Math.round(p.price*(100-p.disc)/100);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200)}
// intro
for(let i=0;i<14;i++){const s=document.createElement("i");s.className="spark";s.style.cssText=`left:${Math.random()*100}%;top:${50+Math.random()*45}%;animation-delay:${Math.random()*2.5}s`;$("#intro").appendChild(s)}
setTimeout(()=>$("#intro").classList.add("off"),2900);
// login

const sc=document.createElement("div");sc.className="card hide";sc.id="sc";
sc.innerHTML=`<h1 style="margin:.4rem 0">إنشاء حساب جديد</h1><label for="sn">الاسم</label><input id="sn" autocomplete="name"><label for="sph">رقم الهاتف</label><input id="sph" inputmode="tel" autocomplete="tel"><label for="sp">كلمة السر</label><input id="sp" type="password" autocomplete="new-password"><div class="err" id="serr" role="alert"></div><button class="gold" id="sgo" style="width:100%">إنشاء الحساب</button><button class="ghost" id="sback" style="width:100%;margin-top:.6rem">لدي حساب، تسجيل الدخول</button>`;
$("#login").appendChild(sc);
const lc=$("#login .card:not(#sc)"),flip=b=>{sc.classList.toggle("hide",!b);lc.classList.toggle("hide",b)};
$("#tosu").onclick=()=>flip(true);$("#sback").onclick=()=>flip(false);
$("#sgo").onclick=()=>{const n=$("#sn").value.trim(),ph=$("#sph").value.trim(),p=$("#sp").value;
 if(!n||ph.length<8||p.length<4){$("#serr").textContent="اكتبي الاسم ورقم هاتف صحيح وكلمة سر 4 أحرف على الأقل";return}
 if(n=="علي"||(st.users||{})[n]!==undefined){$("#serr").textContent="هذا الاسم مستخدم، اختاري اسماً آخر";return}
 st.users=st.users||{};st.users[n]={p,ph};save();$("#cn").value=n;$("#ap").value="";$("#sn").value=$("#sph").value=$("#sp").value="";$("#serr").textContent="";flip(false);toast("تم إنشاء حسابك، سجّلي الدخول الآن")};
$("#go").onclick=()=>{
 const n=$("#cn").value.trim(),p=$("#ap").value;if(!n||!p){$("#err").textContent="اكتبي الاسم وكلمة السر";return}if(n=="علي"){if(p!="123456"){$("#err").textContent="الاسم أو كلمة السر غير صحيحة";return}user={name:"علي",admin:true}}
 else{const u=(st.users||{})[n],pw=u&&(typeof u=="string"?u:u.p);if(pw===undefined||pw!==p){$("#err").textContent="الاسم أو كلمة السر غير صحيحة. إن لم يكن لديك حساب فأنشئي حساباً جديداً";return}user={name:n,admin:false,phone:(u&&u.ph)||""}}
 $("#login").classList.add("hide");$("#app").classList.remove("hide");$$(".adm").forEach(b=>b.classList.toggle("hide",!user.admin));go("shop");
};
$("#out").onclick=()=>{user=null;cart={};$("#app").classList.add("hide");$("#login").classList.remove("hide");$("#ap").value="";upc()};
function go(v){$$(".view").forEach(x=>x.classList.toggle("on",x.id=="v-"+v));$$("#nav [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v==v));
 if(v=="shop")shop();if(v=="cart")cartv();if(v=="admin"&&user.admin)adm()}
$$("#nav [data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
// shop
function shop(){const q=$("#q").value.trim().toLowerCase(),c=$("#cat").value;
 const l=st.products.filter(p=>(!c||p.cat==c)&&(!q||p.name.toLowerCase().includes(q)||p.bc.includes(q)));
 $("#grid").innerHTML=l.length?l.map(p=>`<article class="card p">${p.disc?`<span class="tag">خصم ${p.disc}%</span>`:""}<div class="ic">${ICON[p.cat]||"✨"}</div><b>${esc(p.name)}</b><small>${esc(p.cat)} · ${esc(p.bc)}</small><div><span class="price">${fin(p)} جنيه</span> ${p.disc?`<span class="old">${p.price}</span>`:""}</div>${p.qty<=0?'<span class="low">نفدت الكمية</span>':p.qty<=5?`<span class="low">متبقي ${p.qty} فقط</span>`:""}<button class="rose" data-add="${p.id}" ${p.qty<=0?"disabled":""}>أضيفي إلى السلة</button></article>`).join(""):'<p>لا توجد نتائج. جرّبي اسماً أو باركوداً آخر.</p>'}
$("#q").oninput=shop;$("#cat").onchange=shop;
$("#grid").onclick=e=>{const id=e.target.dataset.add;if(!id)return;const p=st.products.find(x=>x.id==id);if((cart[id]||0)>=p.qty){toast("وصلتِ للحد الأقصى المتاح");return}cart[id]=(cart[id]||0)+1;upc();toast("تمت الإضافة إلى السلة")};
$("#scan").onclick=async()=>{
 if(!("BarcodeDetector" in window)){toast("المسح غير مدعوم هنا، اكتبي رقم الباركود");$("#q").focus();return}
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}),v=document.createElement("video");v.srcObject=s;v.setAttribute("playsinline","");await v.play();const d=new BarcodeDetector();
  const t=setInterval(async()=>{const r=await d.detect(v);if(r.length){$("#q").value=r[0].rawValue;clearInterval(t);s.getTracks().forEach(x=>x.stop());shop()}},400);setTimeout(()=>{clearInterval(t);s.getTracks().forEach(x=>x.stop())},15000)}catch(e){toast("تعذّر فتح الكاميرا")}};
const upc=()=>$("#cc").textContent=Object.values(cart).reduce((a,b)=>a+b,0);
function cartv(){$("#cph").value=$("#cph").value||user.phone||"";const k=Object.keys(cart);let t=0;
 $("#ci").innerHTML=k.length?k.map(id=>{const p=st.products.find(x=>x.id==id);t+=fin(p)*cart[id];return`<div class="row"><span>${esc(p.name)}<br><small>${fin(p)} × ${cart[id]}</small></span><span><button class="ghost" data-m="${id}">−</button> <button class="ghost" data-pl="${id}">+</button></span></div>`}).join(""):"<p>السلة فارغة. اختاري منتجاتك من صفحة المنتجات.</p>";
 $("#ct").textContent=t+" جنيه";upc()}
$("#ci").onclick=e=>{const m=e.target.dataset.m,p=e.target.dataset.pl;if(m){cart[m]--;if(cart[m]<=0)delete cart[m]}if(p){const x=st.products.find(z=>z.id==p);if(cart[p]<x.qty)cart[p]++}cartv()};
$("#conf").onclick=()=>{const k=Object.keys(cart);if(!k.length){$("#cerr").textContent="السلة فارغة";return}if($("#cph").value.trim().length<8||!$("#ad").value.trim()){$("#cerr").textContent="اكتبي رقم الهاتف وعنوان التوصيل";return}
 let t=0;const items=k.map(id=>{const p=st.products.find(x=>x.id==id);p.qty-=cart[id];t+=fin(p)*cart[id];return{n:p.name,q:cart[id]}});
 const o={id:st.nid++,cust:user.name,phone:$("#cph").value.trim(),addr:$("#ad").value.trim(),pay:document.querySelector("[name=pm]:checked").value,total:t,items,s:0};st.orders.push(o);save();cart={};$("#cerr").textContent="";$("#ad").value="";
 $("#tn").value=o.id;go("track");track();toast("تم تأكيد طلبك رقم "+o.id)};
// track
function track(){const o=st.orders.find(x=>x.id==$("#tn").value.trim());
 $("#tr").innerHTML=o?`<p>الطلب رقم <b>${o.id}</b> · ${o.total} جنيه · ${esc(o.pay)}</p><div class="steps">${STEPS.map((s,i)=>`<div class="st ${i<o.s?"d":""} ${i==o.s?"c":""}"><i>${i<=o.s?"✓":i+1}</i>${s}</div>`).join("")}</div>`:'<p>اكتبي رقم الطلب لعرض حالته.</p>'}
$("#tg").onclick=track;
// admin
function adm(){$("#at").innerHTML=st.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.price}</td><td>${p.disc}%</td><td>${p.qty}</td><td><button class="ghost" data-e="${p.id}">تعديل</button> <button class="ghost" data-d="${p.id}">حذف</button></td></tr>`).join("");
 $("#ot").innerHTML=st.orders.length?st.orders.slice().reverse().map(o=>`<tr><td>${o.id}</td><td>${esc(o.cust)}</td><td>${o.total}</td><td>${STEPS[o.s]}</td><td>${o.s<3?`<button class="rose" data-n="${o.id}">المرحلة التالية</button>`:""}</td></tr>`).join(""):'<tr><td colspan="5">لا توجد طلبات بعد</td></tr>'}
$("#v-admin").onclick=e=>{if(!user||!user.admin)return;const d=e.target.dataset;
 if(d.e){edit=+d.e;const p=st.products.find(x=>x.id==edit);$("#f-n").value=p.name;$("#f-b").value=p.bc;$("#f-c").value=p.cat;$("#f-p").value=p.price;$("#f-d").value=p.disc;$("#f-q").value=p.qty;$("#aft").textContent="تعديل منتج"}
 if(d.d){st.products=st.products.filter(x=>x.id!=d.d);save();adm()}
 if(d.n){const o=st.orders.find(x=>x.id==d.n);o.s++;save();adm()}};
$("#fs").onclick=()=>{if(!user||!user.admin)return;const n=$("#f-n").value.trim(),b=$("#f-b").value.trim(),p=+$("#f-p").value,d=+$("#f-d").value||0,q=+$("#f-q").value;
 if(!n||!b||!(p>0)||d<0||d>100||!(q>=0)||$("#f-q").value===""){$("#aerr").textContent="أكملي كل الحقول: الاسم والباركود والسعر والكمية";return}
 if(st.products.some(x=>x.bc==b&&x.id!=edit)){$("#aerr").textContent="هذا الباركود مسجّل لمنتج آخر";return}
 const o={name:n,bc:b,cat:$("#f-c").value,price:p,disc:d,qty:q};
 if(edit){Object.assign(st.products.find(x=>x.id==edit),o)}else st.products.push({id:Date.now(),...o});
 edit=null;$("#aft").textContent="إضافة منتج";["f-n","f-b","f-p","f-q"].forEach(i=>$("#"+i).value="");$("#f-d").value=0;$("#aerr").textContent="";save();adm();toast("تم حفظ المنتج")};
</script>
</body>
</html>
